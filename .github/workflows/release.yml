name: Release

# Every push to main is packaged and published. The release tag follows the
# version in nsgo.yaml and is rebuilt rather than added to, so `install.sh`
# — which asks for that one tag — always installs the newest commit. A v*
# tag publishes under that tag instead, and a pull request only builds, so
# a commit that does not compile never reaches a release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# One release per ref at a time; a newer push supersedes the one in flight.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  # Optional: a codesigning identity, as a base64 .p12. Without it the
  # bundle is ad-hoc signed — enough for install.sh's curl download, but
  # macOS then forgets the Accessibility and Input Monitoring grants on
  # every install, and Gatekeeper refuses a disk image that came from a
  # browser. Set MACOS_SIGNING_P12, MACOS_SIGNING_P12_PASSWORD,
  # MACOS_SIGNING_KEYCHAIN_PASSWORD and MACOS_SIGNING_IDENTITY (the
  # certificate's common name) to sign with a real one.
  SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
  SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
  SIGNING_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_SIGNING_KEYCHAIN_PASSWORD }}
  SIGNING_IDENTITY_NAME: ${{ secrets.MACOS_SIGNING_IDENTITY }}

jobs:
  build:
    # Apple silicon, which is the only macOS target built here.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: |
          go vet ./...
          go test ./...

      # Puts the certificate where `make sign` looks for it — a keychain at
      # .signing/rcmd-nsgo.keychain-db with its password beside it — so the
      # build signs the same way it does on a development machine.
      - name: Signing setup
        run: |
          echo "SIGN_IDENTITY=${SIGNING_IDENTITY_NAME:-rcmd-nsgo Dev}" >> "$GITHUB_ENV"
          if [ -z "${SIGNING_P12:-}" ]; then
            echo "no signing identity; the bundle will be ad-hoc signed"
            exit 0
          fi
          keychain="$PWD/.signing/rcmd-nsgo.keychain-db"
          mkdir -p .signing
          printf '%s' "$SIGNING_KEYCHAIN_PASSWORD" > .signing/password
          security create-keychain -p "$SIGNING_KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$SIGNING_KEYCHAIN_PASSWORD" "$keychain"
          printf '%s' "$SIGNING_P12" | base64 -D > "$RUNNER_TEMP/identity.p12"
          security import "$RUNNER_TEMP/identity.p12" -k "$keychain" \
            -P "$SIGNING_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$SIGNING_KEYCHAIN_PASSWORD" "$keychain"
          rm -f "$RUNNER_TEMP/identity.p12"

      # A tag build publishes under the tag; anything else under the version
      # nsgo.yaml carries, which `-version` writes into the install scripts.
      - name: Work out the version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(sed -n 's/^version:[[:space:]]*//p' nsgo.yaml | head -1)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Build and package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: make build GO=go VERSION="$VERSION" CREATE_IDENTITY=0

      # The image is only useful if it carries the helper and a signature
      # macOS will accept, which is what the build got wrong before.
      - name: Check the package
        run: |
          set -eux
          ls -l dist/releases
          ( cd dist/releases && shasum -a 256 -c ./*.dmg.sha256 )
          app="$(ls -d dist/*/rcmd-nsgo.app)"
          codesign --verify --strict "$app"
          test -x "$app/Contents/MacOS/rcmd-helper"

      - uses: actions/upload-artifact@v4
        with:
          name: release
          if-no-files-found: error
          path: |
            dist/releases/*.dmg
            dist/releases/*.dmg.sha256
            dist/releases/install.sh
            dist/releases/install.ps1

  release:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release
          path: assets

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(sed -n 's/^version:[[:space:]]*//p' nsgo.yaml | head -1)"
          fi
          short="${GITHUB_SHA:0:7}"
          subject="$(git log -1 --pretty=%s)"
          notes="$(printf '%s\n' \
            "提交：[\`$short\`](https://github.com/$GITHUB_REPOSITORY/commit/$GITHUB_SHA) · $subject" \
            "" \
            "安装：" \
            "" \
            '```sh' \
            "curl -fsSL https://github.com/$GITHUB_REPOSITORY/releases/latest/download/install.sh | sh" \
            '```' \
            "" \
            "标签 \`$tag\` 随每次提交重建，永远指向最近一次构建成功的那个提交。")"
          # The tag is rolling, so the assets and the tag have to agree on the
          # commit: the release is rebuilt rather than added to.
          gh release delete "$tag" --cleanup-tag --yes >/dev/null 2>&1 || true
          gh release create "$tag" assets/* \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --notes "$notes"
